[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[project]
name = "warp-sycl"
version = "0.1.0"
description = "Intel GPU (SYCL) training support for mjlab: warp-sycl runtime patch + barrier-free flat kernels + a select_gpus-free train entry"
readme = "README-SYCL-TRAINING.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "mjlab==1.3.0",
    "mujoco-warp>=3.8.1",
    "warp-lang==1.12.0",
    "torch==2.9.1",
]

[project.scripts]
warp-sycl-train = "warp_sycl.train:main"
warp-sycl-bench = "warp_sycl.bench:main"
