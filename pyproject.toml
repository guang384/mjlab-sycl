[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[project]
name = "mjlab-sycl"
version = "0.2.0"
description = "Intel GPU (SYCL) training support for mjlab: warp-sycl runtime patch + barrier-free flat kernels + a select_gpus-free train entry + verification gates"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "mjlab==1.3.0",
    # flat_kernels.py intercepts mujoco_warp internals by compiled kernel .key
    # string and by module path (_src.solver/_src.constraint) — pinned ==, not
    # >=: a mujoco-warp bump silently breaks every interception.
    "mujoco-warp==3.8.1",
    "warp-lang==1.12.0",
    "torch==2.9.1",
]

# pytest is only needed to run the host-only overlay gate (the GPU gates run
# via `mjlab-sycl-test`, not pytest); testpaths keeps a bare `pytest` from
# collecting the in-package GPU test modules on machines without the stack.
[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
mjlab-sycl-train = "mjlab_sycl.train:main"
mjlab-sycl-bench = "mjlab_sycl.bench:main"
mjlab-sycl-test = "mjlab_sycl.test:main"
mjlab-sycl-check = "mjlab_sycl.doctor:main"
mjlab-sycl-install = "mjlab_sycl.install:main"

[tool.pytest.ini_options]
testpaths = ["src/mjlab_sycl/test_overlay.py"]
